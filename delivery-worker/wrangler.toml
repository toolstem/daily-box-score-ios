# NOT DEPLOYED. Draft config for the box score paper delivery Worker.
# Deploy only after Jonathan approves, the security review is clean,
# and the provider setup in archive-pass-design.md is done.
name = "boxscore-delivery"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# Custom domain, added at deploy time:
# routes = [{ pattern = "delivery.toolstem.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "boxscore-delivery"
database_id = "REPLACE_AT_SETUP"
migrations_dir = "migrations"

# Every 5 minutes, 11:00-17:55 UTC (5:00-11:55 a.m. Central in winter,
# 6:00-12:55 in summer). The code itself waits for 7 a.m. Central.
# Needs Workers Paid ($5/month): the free plan allows only 50 database
# queries and about 10 ms of CPU per run, too little for a send batch.
[triggers]
crons = ["*/5 11-17 * * *"]

[vars]
EMAIL_ENABLED = "false"          # server-side switch 1 (app_config.json is switch 2)
SMS_ENABLED = "false"
EMAIL_PROVIDER = "log"           # log | ses | resend
EMAIL_FROM = "The Box Score Paper <paper@toolstem.com>"
PUBLIC_BASE_URL = "https://delivery.toolstem.com"
POSTAL_ADDRESS = ""              # REQUIRED before any send (CAN-SPAM): OM Collective LLC mailing address
AWS_REGION = "us-east-1"
SES_CONFIGURATION_SET = ""
DELIVERY_EARLIEST_HOUR_CT = "7"
MAX_PAPER_AGE_DAYS = "2"
MAX_RECIPIENTS_PER_RUN = "2000"
SEND_BATCH = "25"
APPLE_ALLOW_SANDBOX = "false"
TRIPWIRE_ACK = ""

# Secrets (wrangler secret put NAME), never in this file:
#   LINK_SECRET            random 32+ bytes, signs unsubscribe links
#   APPLE_ISSUER_ID        App Store Connect > Users and Access > Integrations > In-App Purchase
#   APPLE_KEY_ID
#   APPLE_PRIVATE_KEY      contents of the .p8 In-App Purchase key
#   AWS_ACCESS_KEY_ID      IAM user limited to ses:SendRawEmail/SendEmail on the toolstem.com identity
#   AWS_SECRET_ACCESS_KEY
#   RESEND_API_KEY         only if EMAIL_PROVIDER = resend (sending-only key, toolstem.com domain)
